name: CD - Deploy to EC2

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  create-and-deploy:
    name: Create EC2 & Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Create Security Group
        id: sg
        run: |
          SG_NAME="ec2-dashboard-sg-${{ github.run_id }}"
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" --query "Vpcs[0].VpcId" --output text)

          SG_ID=$(aws ec2 create-security-group \
            --group-name "$SG_NAME" \
            --description "Security group for EC2 Dashboard" \
            --vpc-id "$VPC_ID" \
            --query "GroupId" --output text)

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr 0.0.0.0/0

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 5000 --cidr 0.0.0.0/0

          echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT
          echo "=== Created Security Group: $SG_ID ==="

      - name: Generate SSH Key Pair
        id: genkey
        run: |
          KEY_NAME="ec2-dashboard-key-${{ github.run_id }}"

          ssh-keygen -t rsa -b 4096 -f /tmp/ec2_key -N "" -q
          chmod 600 /tmp/ec2_key

          aws ec2 import-key-pair \
            --key-name "$KEY_NAME" \
            --public-key-material fileb:///tmp/ec2_key.pub

          echo "key_name=$KEY_NAME" >> $GITHUB_OUTPUT
          echo "=== Key Pair created: $KEY_NAME ==="

      - name: Get latest Amazon Linux 2023 AMI
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-2023.*-x86_64" \
              "Name=state,Values=available" \
              "Name=architecture,Values=x86_64" \
            --query "sort_by(Images, &CreationDate)[-1].ImageId" \
            --output text)

          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "=== Latest AMI: $AMI_ID ==="

      - name: Launch EC2 Instance
        id: launch
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ steps.ami.outputs.ami_id }} \
            --instance-type t2.micro \
            --key-name "${{ steps.genkey.outputs.key_name }}" \
            --security-group-ids "${{ steps.sg.outputs.sg_id }}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=ec2-dashboard-${{ github.run_id }}},{Key=Project,Value=github-actions-pythonapp}]" \
            --query "Instances[0].InstanceId" --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "=== Launched Instance: $INSTANCE_ID ==="

      - name: Wait for instance to be running
        run: |
          echo "=== Waiting for instance to be in running state ==="
          aws ec2 wait instance-running \
            --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "=== Instance is running ==="

      - name: Wait for status checks to pass
        run: |
          echo "=== Waiting for status checks ==="
          aws ec2 wait instance-status-ok \
            --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "=== Status checks passed ==="

      - name: Get public IP address
        id: get_ip
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.launch.outputs.instance_id }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)

          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "=== Public IP: $PUBLIC_IP ==="

      - name: Wait for SSH to be available
        run: |
          EC2_HOST=${{ steps.get_ip.outputs.public_ip }}
          echo "=== Waiting for SSH on $EC2_HOST ==="
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i /tmp/ec2_key ec2-user@$EC2_HOST "echo SSH ready" 2>/dev/null; then
              echo "=== SSH connection successful ==="
              exit 0
            fi
            echo "Attempt $i: SSH not ready, retrying in 10s..."
            sleep 10
          done
          echo "=== SSH connection failed after 30 attempts ==="
          exit 1

      - name: Install system dependencies on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${{ steps.get_ip.outputs.public_ip }} << 'ENDSSH'
            set -e
            echo "=== Installing system dependencies ==="
            sudo dnf install -y git python3 python3-pip curl
            git --version
            python3 --version
            echo "=== System dependencies ready ==="
          ENDSSH

      - name: Clone repository on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${{ steps.get_ip.outputs.public_ip }} << 'ENDSSH'
            set -e
            echo "=== Cloning repository ==="
            rm -rf ~/ec2-dashboard
            git clone https://github.com/SathyaProlifics/github-actions-pythonapp.git ~/ec2-dashboard
            ls -la ~/ec2-dashboard/
            echo "=== Repository cloned ==="
          ENDSSH

      - name: Set up Python venv and install dependencies
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${{ steps.get_ip.outputs.public_ip }} << 'ENDSSH'
            set -e
            cd ~/ec2-dashboard
            echo "=== Creating virtual environment ==="
            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            echo "=== Dependencies installed ==="
          ENDSSH

      - name: Configure and start systemd service
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${{ steps.get_ip.outputs.public_ip }} << 'ENDSSH'
            set -e
            cd ~/ec2-dashboard
            echo "=== Setting up systemd service ==="
            sudo cp ec2-dashboard.service /etc/systemd/system/ec2-dashboard.service
            sudo systemctl daemon-reload
            sudo systemctl enable ec2-dashboard
            sudo systemctl restart ec2-dashboard
            echo "=== Application started ==="
          ENDSSH

      - name: Verify application health
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/ec2_key ec2-user@${{ steps.get_ip.outputs.public_ip }} << 'ENDSSH'
            set -e
            sleep 5
            echo "=== Checking health endpoint ==="
            curl -f http://localhost:5000/api/health
            echo ""
            echo "=== App is running! ==="
          ENDSSH

      - name: Print application URL
        run: |
          echo "============================================"
          echo " Application deployed successfully!"
          echo " URL: http://${{ steps.get_ip.outputs.public_ip }}:5000"
          echo " Instance ID: ${{ steps.launch.outputs.instance_id }}"
          echo "============================================"

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/ec2_key /tmp/ec2_key.pub
