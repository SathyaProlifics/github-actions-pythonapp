name: CD - Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and run tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pytest tests/ -v

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            # --- Install system dependencies (first-time setup) ---
            if ! command -v git &> /dev/null; then
              echo "Installing git..."
              sudo yum install -y git
            fi

            if ! command -v python3 &> /dev/null; then
              echo "Installing Python3..."
              sudo yum install -y python3 python3-pip
            fi

            if ! command -v curl &> /dev/null; then
              echo "Installing curl..."
              sudo yum install -y curl
            fi

            # --- Clone or pull the repo ---
            if [ ! -d ~/ec2-dashboard ]; then
              echo "Cloning repository for the first time..."
              git clone https://github.com/SathyaProlifics/github-actions-pythonapp.git ~/ec2-dashboard
            else
              echo "Pulling latest code..."
              cd ~/ec2-dashboard
              git pull origin main
            fi

            cd ~/ec2-dashboard

            # --- Set up virtual environment (first-time setup) ---
            if [ ! -d venv ]; then
              echo "Creating virtual environment..."
              python3 -m venv venv
            fi

            # Activate venv and install deps
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # --- Set up systemd service ---
            sudo cp ec2-dashboard.service /etc/systemd/system/ec2-dashboard.service
            sudo systemctl daemon-reload
            sudo systemctl enable ec2-dashboard

            # Restart the app
            sudo systemctl restart ec2-dashboard

            # Verify app is running
            sleep 3
            curl -f http://localhost:5000/api/health && echo " App is running!" || echo " App failed to start!"
